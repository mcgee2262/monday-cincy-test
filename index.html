(async()=>{try{if(window.claude&&claude.use){sampleFn=await claude.use("sample");if(sampleFn&&room==="test")render()}}catch(e){}})();
async function claudeGrade(p,txt){
  return sampleFn.json(`You are grading a high school U.S. History honors paragraph. Be encouraging but honest.
Prompt: ${p.q}
Key facts a strong answer could use: ${p.ev.join("; ")}
Student paragraph:
"""${txt}"""
Score each category 0-4: claim (clear arguable topic sentence that answers the prompt), evidence (specific names, dates, laws, events; accurate), analysis (explains why/how evidence proves the claim), organization (logical order, transitions, closing sentence), conventions (grammar, spelling, complete sentences).
Return ONLY JSON: {"claim":n,"evidence":n,"analysis":n,"organization":n,"conventions":n,"strength":"one sentence","fixes":["up to 3 short, specific fixes"],"factErrors":["any historically wrong statements, else empty"]}`,{modelTier:"default"});
}
function testRoom(app){
  if(!W) newTest();
  clearInterval(timerId);
  let total="";
  if(W.graded){
    const avg=Math.round(W.ids.reduce((s,id)=>s+gradeOne(pById(id),W.answers[id]).pct,0)/W.ids.length);
    total=`<div style="display:grid;gap:8px"><span class="grade">${avg>=90?"A":avg>=80?"B":avg>=70?"C":avg>=60?"D":"Redo"} · ${avg}%</span>
      <p style="margin:0">The checker looks for the key ideas a strong paragraph would include. Compare yours with the model paragraph under each prompt${sampleFn?", or ask Claude to grade it with the rubric":""}. Anything under 80% goes to Test Retake.</p></div>`;
  }
  app.innerHTML=`<div class="topic-pick" style="align-items:center">
    <button id="newset" aria-pressed="false">New random 5 prompts</button>
    ${W.graded?"":`<button id="tmr" aria-pressed="${!!W.end}">${W.end?"Timer on":"Start 45-min timer"}</button>`}
    <span class="timer" id="clock"></span>
  </div>
  <form class="paper ${W.graded?"graded":""}" id="paper">
    <div><h2 style="font-size:1.9rem">Writing Test · Jackson to 1860</h2>
    <p style="margin:6px 0 0">Write one honors paragraph for each prompt: a clear claim, specific evidence (names, dates, laws), analysis that explains why, and a closing sentence. Use the paragraph builder if you want help organizing. Your writing saves as you type.</p></div>
    ${total}
    ${W.ids.map((id,n)=>{const p=pById(id),a=W.answers[id]||"",b=W.build[id]||{},g=W.graded&&gradeOne(p,a),ai=W.ai[id];
      return `<fieldset class="mcq" id="w-${id}" style="gap:10px"><legend style="font-size:1.08rem">${n+1}. ${esc(p.q)}<span class="src">Lesson ${T.findIndex(t=>t.id===p.tid)+1}</span></legend>
      <details ${W.open[id+"ev"]?"open":""} data-det="${id}ev"><summary style="cursor:pointer;font-weight:700">Evidence bank</summary><ul style="margin:6px 0 0;padding-left:1.2em">${p.ev.map(e=>`<li>${esc(e)}</li>`).join("")}</ul></details>
      ${W.graded?"":`<details ${W.open[id+"pb"]?"open":""} data-det="${id}pb"><summary style="cursor:pointer;font-weight:700">Paragraph builder</summary><div class="pb">${BUILD.map(([k,l,h])=>`<label>${l}<textarea rows="2" data-b="${id}" data-k="${k}" placeholder="${esc(h)}">${esc(b[k]||"")}</textarea></label>`).join("")}
        <div class="ctrl"><button type="button" class="btn" style="background:#23312b;color:#f6f1df" data-drop="${id}">Put it in my answer ↓</button><span class="muted" style="color:#55625b;font-size:.85rem">Replaces what's in the box.</span></div></div></details>`}
      <textarea class="wbox" rows="8" data-w="${id}" ${W.graded?"readonly":""} placeholder="Write your paragraph here…">${esc(a)}</textarea>
      <div class="mono" style="font-size:.78rem;color:#55625b" id="wc-${id}">${words(a)} words</div>
      ${g?`<div style="display:grid;gap:6px"><b style="color:${g.pct>=80?"#1d7a3a":"#a2312b"}">Key ideas: ${g.pct}%</b><div class="breakdown">${g.res.map(r=>`<span class="${r.hit?"hi":"lo"}">${r.hit?"✓":"✗"} ${esc(r.idea)}</span>`).join("")}</div>
        <details><summary style="cursor:pointer;font-weight:700;color:#a2312b">Model honors paragraph</summary><p class="model">${esc(p.model)}</p></details>
        ${sampleFn?`<div class="ctrl"><button type="button" class="btn" style="background:#f2d675;color:#2b2410" data-ai="${id}" ${ai&&ai.busy?"disabled":""}>${ai&&ai.busy?"Claude is grading…":ai&&ai.r?"Grade again with Claude":"✨ Grade with Claude"}</button></div>`:""}
        ${ai&&ai.r?aiHTML(ai.r):ai&&ai.err?`<p class="warn-line" style="margin:0">${esc(ai.err)}</p>`:""}</div>`:""}
    </fieldset>`}).join("")}
    <div class="ctrl">${W.graded?`<button class="btn" type="button" id="again" style="background:#23312b;color:#f6f1df">New random 5 prompts</button><button class="btn" type="button" id="tort" style="background:#f2d675;color:#2b2410">Test Retake →</button>`
      :`<button class="btn" type="submit" style="background:#23312b;color:#f6f1df">Turn it in</button><span class="warn-line" id="warn"></span>`}</div>
  </form>`;
  const rr=()=>{const y=scrollY;testRoom(app);scrollTo(0,y)};
  $("#newset").onclick=()=>{if(!W.graded&&Object.values(W.answers).some(x=>x&&x.trim())&&!confirm("Start over with 5 new prompts? Your current paragraphs will be cleared."))return;newTest();testRoom(app);scrollTo(0,0)};
  app.querySelectorAll("[data-det]").forEach(d=>d.ontoggle=()=>{W.open[d.dataset.det]=d.open;saveW()});
  if(W.graded){
    $("#again").onclick=()=>{newTest();testRoom(app);scrollTo(0,0)};
    $("#tort").onclick=()=>go("retake");
    app.querySelectorAll("[data-ai]").forEach(b=>b.onclick=async()=>{const id=b.dataset.ai,p=pById(id);
      W.ai[id]={busy:true};rr();
      try{const r=await claudeGrade(p,W.answers[id]||"");W.ai[id]={r}}catch(e){W.ai[id]={err:e&&e.code==="not_granted"?"Claude grading wasn't allowed.":e&&e.code==="rate_limited"?"Too many requests. Try again in a minute.":"Claude couldn't grade that one. Try again."}}
      saveW();if(room==="test")rr()});
    return;
  }
  $("#tmr").onclick=()=>{W.end=W.end?null:Date.now()+45*60*1000;saveW();testRoom(app)};
  const tick=()=>{const c=$("#clock");if(!c||!W.end){if(c)c.textContent="";return}
    const ms=Math.max(0,W.end-Date.now());c.textContent=ms?`${fmt(ms)} left`:"Time's up! Turn it in.";};
  tick(); timerId=setInterval(tick,1000);
  $("#paper").oninput=e=>{const t=e.target;
    if(t.dataset.w){W.answers[t.dataset.w]=t.value;$("#wc-"+t.dataset.w).textContent=words(t.value)+" words";saveW()}
    if(t.dataset.b){const b=W.build[t.dataset.b]=W.build[t.dataset.b]||{};b[t.dataset.k]=t.value;saveW()}};
  app.querySelectorAll("[data-drop]").forEach(b=>b.onclick=()=>{const id=b.dataset.drop,x=W.build[id]||{};
    const fix=s=>{s=(s||"").trim();return s&&!/[.!?"]$/.test(s)?s+".":s};
    const txt=["claim","ev1","ev2","ev3","an","close"].map(k=>fix(x[k])).filter(Boolean).join(" ");
    if(!txt)return;W.answers[id]=txt;saveW();const box=app.querySelector(`[data-w="${id}"]`);box.value=txt;$("#wc-"+id).textContent=words(txt)+" words";box.focus()});
  $("#paper").onsubmit=e=>{e.preventDefault();
    const blank=W.ids.filter(id=>words(W.answers[id])<15).length;
    if(blank&&!W.warned){W.warned=true;saveW();$("#warn").textContent=`${blank} paragraph${blank>1?"s are":" is"} empty or very short. Tap Turn it in again to submit anyway.`;return}
    W.graded=true;W.end=null;R=null;
    W.ids.forEach(id=>{const p=pById(id),pct=gradeOne(p,W.answers[id]).pct;S.test[p.tid]=Math.max(S.test[p.tid]??0,pct)});
    saveW();save();testRoom(app);scrollTo(0,0);
    const avg=W.ids.reduce((s,id)=>s+gradeOne(pById(id),W.answers[id]).pct,0)/W.ids.length;if(avg>=90)confetti();
  };
}
function aiHTML(r){
  const cats=[["claim","Claim"],["evidence","Evidence"],["analysis","Analysis"],["organization","Organization"],["conventions","Conventions"]];
  const tot=cats.reduce((s,[k])=>s+(+r[k]||0),0);
  return `<div class="aibox"><b>Claude's rubric score: ${tot}/20</b><div class="breakdown">${cats.map(([k,l])=>`<span class="${(+r[k]||0)>=3?"hi":"lo"}">${l} ${+r[k]||0}/4</span>`).join("")}</div>
    ${r.strength?`<p style="margin:0"><b>Strength:</b> ${esc(r.strength)}</p>`:""}
    ${(r.fixes||[]).length?`<p style="margin:0"><b>Fix:</b></p><ul style="margin:0;padding-left:1.2em">${r.fixes.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>`:""}
    ${(r.factErrors||[]).length?`<p class="warn-line" style="margin:0">Check these facts: ${r.factErrors.map(esc).join(" · ")}</p>`:""}</div>`;
}

/* Test Retake: prompts that scored under 80% on the last graded Writing Test, one at a time, with the key-idea checker. */
let R=null;
const retakePool=()=>W&&W.graded?W.ids.filter(id=>gradeOne(pById(id),W.answers[id]).pct<80):[];
function retakeRoom(app){
  if(!W||!W.graded){
    app.innerHTML=`<section class="hero"><h1 style="font-size:2.2rem">Test Retake</h1><p>Take and turn in the Writing Test first. Then this tab brings back every prompt that scored under 80% so you can rewrite it.</p><div><button class="btn y" id="totest">Go to the Writing Test →</button></div></section>`;
    $("#totest").onclick=()=>go("test");return;
  }
  const pool=retakePool();
  if(!R){
    app.innerHTML=`<section class="hero" style="padding-bottom:0"><h1 style="font-size:clamp(1.9rem,5vw,2.8rem)">Test Retake</h1>
      <p>Rewrite the prompts that scored under 80% on your last Writing Test. Your first try stays below the box so you can see what to add.</p></section>
      <div class="qbox">
        <div class="score"><span>Under 80% <b>${pool.length}</b></span><span>of <b>${W.ids.length}</b> prompts</span></div>
        ${pool.map(id=>`<div class="muted">• ${esc(pById(id).q)} <span class="mono">(${gradeOne(pById(id),W.answers[id]).pct}%)</span></div>`).join("")}
        <div class="ctrl"><button class="btn y" id="rstart" ${pool.length?"":"disabled"}>${pool.length?"Start retake →":"Nothing under 80%. Nice!"}</button></div>
      </div>`;
    if(pool.length) $("#rstart").onclick=()=>{R={list:pool,i:0,txt:{},checked:{}};retakeRoom(app)};
    return;
  }
  if(R.i>=R.list.length){
    const res=R.list.map(id=>({id,pct:gradeOne(pById(id),R.txt[id]).pct}));
    app.innerHTML=`<div class="qbox" style="text-align:center"><h2 style="font-family:var(--f-display);font-size:2rem">Retake done</h2>
      ${res.map(r=>`<p style="margin:0">${esc(pById(r.id).q)} <b style="color:${r.pct>=80?"var(--good)":"var(--bad)"}">${r.pct}%</b></p>`).join("")}
      <div class="ctrl" style="justify-content:center"><button class="btn y" id="back">Back to the list</button><button class="btn ghost" id="nt">New Writing Test →</button></div></div>`;
    if(res.every(r=>r.pct>=80)) confetti();
    $("#back").onclick=()=>{R=null;retakeRoom(app)}; $("#nt").onclick=()=>{newTest();go("test")};
    return;
  }
  const id=R.list[R.i], p=pById(id), done=R.checked[id], g=done&&gradeOne(p,R.txt[id]);
  app.innerHTML=`<div class="qbox">
    <div class="score"><span>Prompt <b>${R.i+1}</b>/${R.list.length}</span><span>First try <b>${gradeOne(p,W.answers[id]).pct}%</b></span></div>
    <h2>${esc(p.q)}</h2>
    <details><summary style="cursor:pointer;font-weight:700">Evidence bank</summary><ul>${p.ev.map(e=>`<li>${esc(e)}</li>`).join("")}</ul></details>
    <textarea class="wbox dark" rows="8" id="rt" placeholder="Rewrite your paragraph…">${esc(R.txt[id]||"")}</textarea>
    ${g?`<b style="color:${g.pct>=80?"var(--good)":"var(--bad)"}">Key ideas: ${g.pct}%</b><div class="chips">${g.res.map(r=>`<span class="chip ${r.hit?"ok":""}" style="${r.hit?"":"border-color:var(--bad);color:var(--bad)"}">${r.hit?"✓":"✗"} ${esc(r.idea)}</span>`).join("")}</div>
      <details><summary style="cursor:pointer;font-weight:700;color:var(--yellow)">Model honors paragraph</summary><p class="why">${esc(p.model)}</p></details>`:""}
    <div class="ctrl"><button class="btn y" id="rc">Check it</button>${g?`<button class="btn" id="nq">${R.i+1<R.list.length?"Next prompt →":"Finish →"}</button>`:""}</div>
    <details><summary style="cursor:pointer" class="muted">My first try</summary><p class="why">${esc(W.answers[id]||"(blank)")}</p></details>
  </div>`;
  $("#rt").oninput=e=>{R.txt[id]=e.target.value};
  $("#rc").onclick=()=>{R.checked[id]=true;retakeRoom(app)};
  const nq=$("#nq"); if(nq) nq.onclick=()=>{R.i++;retakeRoom(app);scrollTo(0,0)};
}

renderTabs(); render();
</script>

<script id="ps5pad">/* PS5 (DualSense) / any standard controller support for Blaze's Study Guides.
   D-pad or left stick: move the yellow highlight.  ✕: press it.  ○: back to Classroom.
   □: read the slide aloud.  △: flip card / "Got it down".  L1/R1: switch tabs.
   L2/R2: previous/next slide or question.  Right stick: scroll.  OPTIONS: show the controls. */
(function(){
  if(!("getGamepads" in navigator)) return;
  const css=document.createElement("style");
  css.textContent=`
  body.pad :focus{outline:4px solid #ffd54a!important;outline-offset:3px!important;box-shadow:0 0 0 8px rgba(255,213,74,.35)!important}
  #padtoast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:9999;background:#1d2b24;color:#f6f1e3;border:2px solid #ffd54a;border-radius:12px;padding:10px 16px;font:600 15px/1.3 system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:opacity .3s;pointer-events:none}
  #padhelp{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;background:rgba(0,0,0,.55)}
  #padhelp .box{background:#1d2b24;color:#f6f1e3;border:3px solid #ffd54a;border-radius:16px;padding:20px 24px;max-width:440px;width:calc(100% - 32px);font:16px/1.45 system-ui,sans-serif}
  #padhelp h2{margin:0 0 10px;font-size:20px;color:#ffd54a}
  #padhelp table{border-collapse:collapse;width:100%}#padhelp td{padding:4px 6px;vertical-align:top}#padhelp td:first-child{font-weight:700;white-space:nowrap;color:#ffd54a}
  #padhelp p{margin:12px 0 0;font-size:14px;opacity:.85}`;
  document.head.appendChild(css);

  const FOCUSABLE='button,a[href],select,input:not([type=hidden]),textarea,[tabindex]:not([tabindex="-1"]),[role=button]';
  const visible=el=>{if(el.disabled||el.closest("[hidden],#padhelp"))return false;const r=el.getBoundingClientRect();if(r.width<2||r.height<2)return false;const s=getComputedStyle(el);return s.visibility!=="hidden"&&s.display!=="none"};
  const items=()=>[...document.querySelectorAll(FOCUSABLE)].filter(visible);
  const center=r=>({x:r.left+r.width/2,y:r.top+r.height/2});
  const $=s=>document.querySelector(s);
  const vis=s=>{const e=$(s);return e&&visible(e)?e:null};

  function padOn(){if(!document.body.classList.contains("pad"))document.body.classList.add("pad")}
  document.addEventListener("mousedown",()=>document.body.classList.remove("pad"),true);

  function focusEl(el){if(!el)return;padOn();el.focus({preventScroll:true});el.scrollIntoView({block:"nearest",inline:"nearest",behavior:"smooth"})}
  function firstInView(){const all=items();return all.find(e=>{const r=e.getBoundingClientRect();return r.top>=0&&r.bottom<=innerHeight})||all[0]}

  /* Spatial move: nearest control in the pressed direction, preferring ones lined up with the current one. */
  function move(dx,dy){
    const cur=document.activeElement;
    if(!cur||cur===document.body||!visible(cur)){focusEl(firstInView());return}
    if(cur.type==="range"&&dx){dx>0?cur.stepUp():cur.stepDown();cur.dispatchEvent(new Event("input",{bubbles:true}));cur.dispatchEvent(new Event("change",{bubbles:true}));return}
    const A=cur.getBoundingClientRect(),a=center(A);let best=null,bs=Infinity;
    for(const el of items()){
      if(el===cur||cur.contains(el)||el.contains(cur))continue;
      const B=el.getBoundingClientRect(),b=center(B);
      if(dx>0?B.left<a.x:dx<0?B.right>a.x:dy>0?B.top<a.y:B.bottom>a.y)continue; /* must start past the current control's middle */
      if(dy&&B.left<A.right&&B.right>A.left&&B.top<A.bottom&&B.bottom>A.top)continue; /* up/down skips overlapping controls (e.g. a card's ✓) */
      const gap=Math.max(0,dx>0?B.left-A.right:dx<0?A.left-B.right:dy>0?B.top-A.bottom:A.top-B.bottom);
      const side=dx?Math.max(0,B.top-A.bottom,A.top-B.bottom):Math.max(0,B.left-A.right,A.left-B.right);
      const score=gap+side*4+Math.abs(dx?b.y-a.y:b.x-a.x)*0.15;   /* lined-up controls win */
      if(score<bs){bs=score;best=el}
    }
    if(best)focusEl(best);else if(dy)window.scrollBy({top:dy*240,behavior:"smooth"});
  }

  function press(){
    const el=document.activeElement;
    if(!el||el===document.body||!visible(el)){focusEl(firstInView());return}
    if(el.tagName==="SELECT"){el.selectedIndex=(el.selectedIndex+1)%el.options.length;el.dispatchEvent(new Event("change",{bubbles:true}));toast("Picked: "+el.options[el.selectedIndex].text);return}
    if(el.tagName==="TEXTAREA"||(el.tagName==="INPUT"&&/^(text|number|search|email)?$/.test(el.type))){toast("Type your answer on the keyboard");return}
    const key=memo(el),at=center(el.getBoundingClientRect());el.click();
    /* Rooms re-render after clicks, so put the highlight back on the same control (or the slide's Next button). */
    setTimeout(()=>{if(!document.activeElement||document.activeElement===document.body)focusEl(recall(key,at)||(document.querySelector(".opt:not([disabled])")?nearest(".opt"):nearest(FOCUSABLE,at))||firstInView())},60);
  }

  function memo(el){if(el.id)return "#"+CSS.escape(el.id);for(const k of ["room","t","i","mv","p"])if(el.dataset[k]!=null)return `[data-${k}="${CSS.escape(el.dataset[k])}"]`;return null}
  function recall(key,at){return key?nearest(key,at):null}
  function nearest(sel,at){const c=[...document.querySelectorAll(sel)].filter(visible);if(!at)return c[0];let best=null,bd=Infinity;for(const e of c){const p=center(e.getBoundingClientRect()),d=Math.hypot(p.x-at.x,p.y-at.y);if(d<bd){bd=d;best=e}}return best}
  function clickFirst(...sel){for(const s of sel){const e=vis(s);if(e){e.click();setTimeout(()=>{if(!document.activeElement||document.activeElement===document.body)focusEl(vis(s)||firstInView())},60);return true}}return false}
  function tab(step){
    const tabs=[...document.querySelectorAll("#tabs [data-room]")];if(!tabs.length)return;
    let i=tabs.findIndex(t=>t.getAttribute("aria-selected")==="true");i=(i+step+tabs.length)%tabs.length;
    tabs[i].click();setTimeout(()=>{padOn();const t=$(`#tabs [data-room="${tabs[i].dataset.room}"]`);if(t)t.focus({preventScroll:true})},60);
  }

  let tt;function toast(msg){let t=$("#padtoast");if(!t){t=document.createElement("div");t.id="padtoast";document.body.appendChild(t)}t.textContent=msg;t.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>t.style.opacity=0,2200)}

  function help(){
    const h=$("#padhelp");if(h){h.remove();return}
    const d=document.createElement("div");d.id="padhelp";
    d.innerHTML=`<div class="box"><h2>🎮 Controller</h2><table>
      <tr><td>D-pad / left stick</td><td>Move the yellow highlight</td></tr>
      <tr><td>✕</td><td>Press the highlighted button</td></tr>
      <tr><td>○</td><td>Back to the Classroom</td></tr>
      <tr><td>□</td><td>Read the slide aloud (again to stop)</td></tr>
      <tr><td>△</td><td>Flip the flashcard / "Got it down"</td></tr>
      <tr><td>L1 / R1</td><td>Previous / next tab</td></tr>
      <tr><td>L2 / R2</td><td>Previous / next slide or question</td></tr>
      <tr><td>Right stick</td><td>Scroll the page</td></tr>
      <tr><td>OPTIONS</td><td>Show or hide this</td></tr></table>
      <p>No sound? Click the page once with the mouse, then the controller can play it too.</p></div>`;
    d.addEventListener("click",()=>d.remove());document.body.appendChild(d);
  }

  const ACT={
    0:press,
    1:()=>{if($("#padhelp"))return help();const a=document.activeElement;if(a&&/^(TEXTAREA|INPUT)$/.test(a.tagName)){a.blur();return}const h=$('#tabs [data-room="home"]');if(h&&h.getAttribute("aria-selected")!=="true")h.click();else{const back=[...document.querySelectorAll("a[href]")].find(x=>/study guides/i.test(x.textContent));if(back)focusEl(back)}},
    2:()=>clickFirst("#read"),
    3:()=>clickFirst("#flip","#know"),
    4:()=>tab(-1),5:()=>tab(1),
    6:()=>clickFirst("#prev","#back"),
    7:()=>clickFirst("#next","#nq","#nt","#np","#nx"),
    8:help,9:help,
    12:()=>move(0,-1),13:()=>move(0,1),14:()=>move(-1,0),15:()=>move(1,0)
  };
  const REPEAT=new Set([12,13,14,15]);
  const held={};let raf=0,stickDir=null,stickT=0;

  function loop(){const t=performance.now();
    const pads=navigator.getGamepads?[...navigator.getGamepads()].filter(Boolean):[];
    if(!pads.length){clearInterval(raf);raf=0;return}
    for(const gp of pads){
      gp.buttons.forEach((b,i)=>{
        const on=b.pressed||b.value>0.6,k=gp.index+":"+i;
        if(on&&!held[k]){held[k]=t+380;if(ACT[i]){padOn();ACT[i]()}}
        else if(on&&REPEAT.has(i)&&t>held[k]){held[k]=t+110;ACT[i]()}
        else if(!on)delete held[k];
      });
      const [lx=0,ly=0,rx=0,ry=0]=gp.axes;
      let dir=null;if(Math.hypot(lx,ly)>0.55)dir=Math.abs(lx)>Math.abs(ly)?(lx>0?15:14):(ly>0?13:12);
      if(dir!==stickDir){stickDir=dir;stickT=t+380;if(dir)ACT[dir]()}else if(dir&&t>stickT){stickT=t+130;ACT[dir]()}
      if(Math.abs(ry)>0.2)window.scrollBy(0,ry*22);
      if(Math.abs(rx)>0.2)window.scrollBy(rx*22,0);
    }
  }
  function start(){if(!raf)raf=setInterval(loop,16)}
  addEventListener("gamepadconnected",e=>{start();toast("🎮 Controller connected — press OPTIONS for the controls")});
  addEventListener("gamepaddisconnected",()=>toast("Controller disconnected"));
  if([...navigator.getGamepads()].some(Boolean))start();
})();
</script>
